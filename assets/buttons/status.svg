<svg xmlns="http://www.w3.org/2000/svg" width="400" height="84" viewBox="0 0 400 84" role="img" aria-label="Open to an alternance: AI Engineering · ESPRIT">
<title>Open to an alternance — AI Engineering · ESPRIT</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="398" height="82" rx="20"/></clipPath>
</defs>
<style>
  .sheen { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0%,60% { transform: translateX(-160px) } 100% { transform: translateX(460px) } }
  .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(2.6); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .sheen, .pulse { animation: none } }
</style>
<g clip-path="url(#c)">
  <rect width="400" height="84" fill="#070b18"/>
  <rect width="400" height="84" fill="#10b981" fill-opacity=".07"/>
  <rect class="sheen" x="0" y="0" width="110" height="84" fill="url(#sheen)" transform="skewX(-18)"/>
</g>
<rect x="1" y="1" width="398" height="82" rx="20" fill="none" stroke="url(#g)" stroke-opacity=".7" stroke-width="1.5"/>
<rect x="16" y="16" width="52" height="52" rx="14" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-opacity=".45"/>
<circle class="pulse" cx="42" cy="42" r="8" fill="#34d399"/><circle cx="42" cy="42" r="8" fill="#34d399"/><circle cx="42" cy="42" r="3.5" fill="#ecfdf5"/>
<text x="86" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">Open to an alternance</text>
<text x="86" y="61" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#94a3b8">AI Engineering · ESPRIT</text>
</svg>